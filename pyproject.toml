[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fathom-fibers-quick"
version = "0.2.0rc1"
description = "Scientific fiber measurement engine and PySide6 desktop workspace"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "José Labarca Baeza"}]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "tifffile>=2024.2",
  "scipy>=1.11",
  "scikit-image>=0.21",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8", "matplotlib>=3.8"]
validation = ["matplotlib>=3.8"]
spmkit = ["spmkit>=0.1.5.dev0"]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6"]

[project.scripts]
fathom-fibers = "fathom_fibers_quick.cli:main"
fathom-fibers-gui = "fathom_fibers_quick.ui.app:main"


[project.entry-points."fathom_fibers.plugins.v1"]
builtin = "fathom_fibers_quick.builtin_plugin:PLUGIN"

[project.entry-points."spmkit.plugins.v1"]
fathom_fibers = "fathom_fibers_quick.integrations.spmkit:FATHOM_DOMAIN"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
  "unit: deterministic test without external runtimes",
  "matlab: requires FATHOM_MATLAB_EXECUTABLE and a licensed MATLAB runtime",
  "external: invokes a process outside the Python package",
  "slow: longer deterministic scientific regression",
  "realdata: requires the private canonical TIFF dataset",
  "qt: exercises the PySide6 application offscreen",
]
