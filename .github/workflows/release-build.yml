name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_ext: tar.gz
          - os: windows-latest
            artifact_ext: zip
          - os: macos-latest
            artifact_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e ".[gui]"
        shell: bash

      - name: Source gates (tests and lint)
        run: |
          QT_QPA_PLATFORM=offscreen python -m pytest -q -p no:cacheprovider
          python -m ruff check .
        shell: bash

      - name: Build release
        run: python packaging/build_release.py
        shell: bash

      - name: Verify release (no smoke on CI runners)
        run: |
          artifact=$(ls release/FathomFibers-* | grep -v sha256 | head -1)
          python packaging/verify_release.py "$artifact"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FathomFibers-release-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  # Apple Silicon native artifact is built on an ARM macOS runner when one is
  # available; this repository's current macOS runner constraint builds the
  # native architecture it provides (Intel or ARM depending on GitHub).
  build-macos-arm:
    name: macOS arm64 (native ARM runner)
    runs-on: macos-14-large
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e ".[gui]"
        shell: bash
      - name: Build release
        run: python packaging/build_release.py
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FathomFibers-release-macos-arm64
          path: release/*
          if-no-files-found: error
          retention-days: 30

  # NOTE: no GitHub Release is created automatically in this batch.
  # The tag trigger only runs the build; publishing happens manually later.
