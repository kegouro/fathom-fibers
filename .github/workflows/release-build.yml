name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            install_system_deps: true
          - os: windows-latest
            arch: x86_64
            install_system_deps: false
          - os: macos-latest
            arch: arm64
            install_system_deps: false
          - os: macos-15-intel
            arch: x86_64
            install_system_deps: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: matrix.install_system_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
        shell: bash

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e ".[dev,gui]"
        shell: bash

      - name: Source gates (tests and lint)
        run: |
          OMP_NUM_THREADS=1 QT_QPA_PLATFORM=offscreen python -m pytest -q -p no:cacheprovider
          python -m ruff check .
        shell: bash

      - name: Build release
        run: python packaging/build_release.py
        shell: bash

      - name: Verify release (frozen smoke ran during the build)
        run: |
          artifact=$(python -c "import glob; print(sorted(glob.glob('release/FathomFibers-*.zip') + glob.glob('release/FathomFibers-*.tar.gz'))[0])")
          python packaging/verify_release.py "$artifact"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FathomFibers-release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/FathomFibers-*.tar.gz
            release/FathomFibers-*.zip
            release/FathomFibers-*.sha256
          if-no-files-found: error
          retention-days: 30

  # NOTE: no GitHub Release is created automatically from CI; the tag
  # trigger only builds and verifies. Publishing happens manually.
