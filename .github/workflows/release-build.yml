name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            install_system_deps: true
          - os: windows-latest
            arch: x86_64
            install_system_deps: false
          - os: macos-latest
            arch: arm64
            install_system_deps: false
          - os: macos-15-intel
            arch: x86_64
            install_system_deps: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: matrix.install_system_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
        shell: bash

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e ".[dev,gui]"
        shell: bash

      - name: Source gates (tests and lint)
        run: |
          OMP_NUM_THREADS=1 QT_QPA_PLATFORM=offscreen python -m pytest -q -p no:cacheprovider
          python -m ruff check .
        shell: bash

      - name: Validate tag matches package release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(python -c 'import runpy; print(runpy.run_path("src/fathom_fibers_quick/release_scheme.py")["HUMAN_VERSION"])')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match release scheme $expected" >&2
            exit 1
          fi

      - name: Build release
        run: python packaging/build_release.py
        shell: bash

      - name: Verify release (frozen smoke ran during the build)
        run: |
          artifact=$(python -c "import glob; print(sorted(glob.glob('release/FathomFibers-*.zip') + glob.glob('release/FathomFibers-*.tar.gz'))[0])")
          python packaging/verify_release.py "$artifact"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FathomFibers-release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/FathomFibers-*.tar.gz
            release/FathomFibers-*.zip
            release/FathomFibers-*.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: FathomFibers-release-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t assets < <(
            find release-assets -maxdepth 1 -type f \
              \( -name 'FathomFibers-*.tar.gz' -o -name 'FathomFibers-*.zip' -o -name 'FathomFibers-*.sha256' \) \
              | sort
          )
          if [ "${#assets[@]}" -lt 8 ]; then
            printf 'Expected four archives plus four SHA256 sidecars; found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi

          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-rc*|*-alpha*|*-beta*) prerelease+=(--prerelease) ;;
          esac

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Fathom Fibers $GITHUB_REF_NAME" \
              "${prerelease[@]}"
          fi
