name: README screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/fathom_fibers_quick/ui/**"
      - "scripts/capture_readme_screenshots.py"
      - ".github/workflows/readme-screenshots.yml"

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install Fathom Fibers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]"

      - name: Capture reproducible screenshots
        env:
          QT_QPA_PLATFORM: offscreen
          OMP_NUM_THREADS: "1"
        run: python scripts/capture_readme_screenshots.py

      - name: Commit changed screenshots
        run: |
          if git diff --quiet -- docs/assets/workspace.png docs/assets/quick-start.png; then
            echo "README screenshots are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/workspace.png docs/assets/quick-start.png
          git commit -m "docs: refresh application screenshots"
          git push
